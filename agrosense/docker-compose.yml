version: "3.9"

# Ambiente de DESARROLLO local
# Levantar:  docker compose up --build
# Apagar:    docker compose down
# Apagar y borrar datos: docker compose down -v

# Healthcheck común de los servicios Node (node:20-alpine trae el wget de busybox)
x-node-healthcheck: &node-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Secretos de autenticación: se interpolan desde .env (nunca se escriben aquí).
# web-admin y auth solo necesitan JWT_SECRET; los que se llaman entre sí, también SERVICE_TOKEN.
x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
x-servicio-env: &servicio-env
  JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?Falta SERVICE_TOKEN en .env}

services:
  mysql:
    image: mariadb:11
    container_name: agrosense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3306' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: agrosense-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - mysql

  auth-service:
    build: ./services/auth-service
    healthcheck: *node-healthcheck
    container_name: agrosense-auth
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *jwt-env
      # recuperación de contraseña simulada (ver README, Seguridad)
      DEV_SHOW_RESET_TOKEN: ${DEV_SHOW_RESET_TOKEN:-false}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules

  fincas-service:
    build: ./services/fincas-service
    healthcheck: *node-healthcheck
    container_name: agrosense-fincas
    restart: unless-stopped
    env_file: .env
    environment: *servicio-env
    ports:
      - "3002:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/fincas-service:/app
      - /app/node_modules

  lecturas-service:
    build: ./services/lecturas-service
    healthcheck: *node-healthcheck
    container_name: agrosense-lecturas
    restart: unless-stopped
    env_file: .env
    environment: *servicio-env
    ports:
      - "3003:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/lecturas-service:/app
      - /app/node_modules

  etl-service:
    build: ./services/etl-service
    container_name: agrosense-etl
    restart: unless-stopped
    env_file: .env
    environment:
      # en desarrollo, resúmenes cada 5 min para que la gráfica del dashboard avance durante la demo
      ETL_INTERVAL_MINUTES: "5"
      # que los print() del ETL aparezcan al momento en `docker logs`
      PYTHONUNBUFFERED: "1"
    # python:3.12-slim no trae curl/wget y el ETL no expone HTTP: se revisa el
    # archivo de latido que el bucle principal actualiza cada 30 s
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/etl-service:/app

  # Simula los sensores (ESP32): crea datos demo y envía lecturas periódicas
  simulator-service:
    build: ./services/simulator-service
    healthcheck: *node-healthcheck
    container_name: agrosense-simulator
    restart: unless-stopped
    env_file: .env
    environment: *servicio-env
    ports:
      - "3004:3000"
    depends_on:
      mysql:
        condition: service_healthy
      fincas-service:
        condition: service_started
      lecturas-service:
        condition: service_started
    volumes:
      - ./services/simulator-service:/app
      - /app/node_modules
      - simulator_data:/data

  # Respaldos de la base (mariadb-dump) en su propio volumen, fuera del repo
  backup-service:
    build: ./services/backup-service
    healthcheck: *node-healthcheck
    container_name: agrosense-backup
    restart: unless-stopped
    env_file: .env
    environment: *jwt-env
    ports:
      - "3005:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/backup-service:/app
      - /app/node_modules
      - backups_data:/backups

  web-admin:
    build: ./web-admin
    healthcheck: *node-healthcheck
    container_name: agrosense-web
    restart: unless-stopped
    env_file: .env
    environment: *jwt-env
    ports:
      - "8080:3000"
    depends_on:
      - auth-service
      - fincas-service
      - lecturas-service
      - backup-service
    volumes:
      - ./web-admin:/app
      - /app/node_modules

  # Monitoreo de salud y página de estado (ver README, sección "Monitoreo con Uptime Kuma")
  # La imagen ya trae su propio HEALTHCHECK.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: agrosense-uptime-kuma
    restart: unless-stopped
    ports:
      - "3010:3001"
    volumes:
      - uptime_data:/app/data

volumes:
  mysql_data:
  simulator_data:
  backups_data:
  uptime_data:
